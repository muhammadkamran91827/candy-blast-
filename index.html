<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WhatsApp Web</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
}

body {
    background-color: #111b21;
    color: #e9edef;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.app-container {
    width: 100%;
    max-width: 1400px;
    height: 100vh;
    display: flex;
    background-color: #111b21;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
}

/* Sidebar Styles */
.sidebar {
    width: 30%;
    min-width: 320px;
    border-right: 1px solid #222d34;
    display: flex;
    flex-direction: column;
    background-color: #111b21;
}

.header {
    height: 60px;
    background-color: #202c33;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: #00a884;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
}

.search-box {
    padding: 8px 12px;
    background-color: #111b21;
    border-bottom: 1px solid #222d34;
}

.search-input {
    width: 100%;
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    background-color: #202c33;
    color: #e9edef;
    outline: none;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
}

.chat-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid #222d34;
    transition: background 0.2s;
}

.chat-item:hover, .chat-item.active {
    background-color: #2a3942;
}

.chat-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #6b7280;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-right: 15px;
}

.chat-info {
    flex: 1;
}

.chat-name {
    font-size: 16px;
    font-weight: 600;
    color: #e9edef;
}

.chat-last-msg {
    font-size: 13px;
    color: #8696a0;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
}

/* Chat Main Area */
.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    background-color: #0b141a;
    position: relative;
}

.chat-header {
    height: 60px;
    background-color: #202c33;
    padding: 10px 16px;
    display: flex;
    align-items: center;
}

.messages-container {
    flex: 1;
    padding: 20px 5%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background-image: radial-gradient(circle, #182229 1px, transparent 1px);
    background-size: 20px 20px;
}

.message {
    max-width: 65%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 19px;
    position: relative;
    word-wrap: break-word;
}

.message.sent {
    align-self: flex-end;
    background-color: #005c4b;
    color: #e9edef;
    border-top-right-radius: 0;
}

.message.received {
    align-self: flex-start;
    background-color: #202c33;
    color: #e9edef;
    border-top-left-radius: 0;
}

.msg-time {
    font-size: 10px;
    color: #8696a0;
    float: right;
    margin-top: 4px;
    margin-left: 10px;
}

.input-bar {
    height: 62px;
    background-color: #202c33;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.message-input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    background-color: #2a3942;
    color: #e9edef;
    outline: none;
    font-size: 15px;
}

.send-btn {
    background: #00a884;
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.send-btn:hover {
    background: #029071;
}

@media (max-width: 768px) {
    .sidebar { width: 100%; }
    .chat-area { display: none; }
    .app-container.chat-open .sidebar { display: none; }
    .app-container.chat-open .chat-area { display: flex; width: 100%; }
}
</style>
</head>

<body>

<div class="app-container" id="app">
    <div class="sidebar">
        <div class="header">
            <div class="user-avatar">Me</div>
            <span style="font-weight: bold; color: #00a884;">WhatsApp</span>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Search or start new chat">
        </div>
        <div class="chat-list" id="chat-list">
            </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-avatar" id="active-avatar">👤</div>
            <div>
                <div class="chat-name" id="active-name">Select a Chat</div>
                <div style="font-size: 12px; color: #8696a0;" id="active-status">online</div>
            </div>
        </div>

        <div class="messages-container" id="messages">
            </div>

        <div class="input-bar">
            <input type="text" class="message-input" id="msg-input" placeholder="Type a message" onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
// @ts-nocheck

var contacts = [
    { id: 1, name: 'Ali Khan', avatar: '👨‍💼', status: 'online', messages: [{ text: 'سلام! کیا حال ہے؟', time: '10:15 AM', sent: false }] },
    { id: 2, name: 'Sara Ahmad', avatar: '👩‍💻', status: 'last seen today at 9:30 AM', messages: [{ text: 'پروجیکٹ کا کیا اپڈیٹ ہے؟', time: '09:30 AM', sent: false }] },
    { id: 3, name: 'Developers Group 🚀', avatar: '💻', status: 'Ali, Usman, You', messages: [{ text: 'نیا کوڈ اپلوڈ کر دیا گیا ہے۔', time: 'Yesterday', sent: false }] }
];

var activeChatId = 1;

function renderChatList() {
    var listEl = document.getElementById("chat-list");
    listEl.innerHTML = "";

    contacts.forEach(function(c) {
        var lastMsg = c.messages.length > 0 ? c.messages[c.messages.length - 1].text : "";
        var activeClass = c.id === activeChatId ? "active" : "";
        
        var itemHtml = `
            <div class="chat-item ${activeClass}" onclick="selectChat(${c.id})">
                <div class="chat-avatar">${c.avatar}</div>
                <div class="chat-info">
                    <div class="chat-name">${c.name}</div>
                    <div class="chat-last-msg">${lastMsg}</div>
                </div>
            </div>
        `;
        listEl.innerHTML += itemHtml;
    });
}

function selectChat(id) {
    activeChatId = id;
    var contact = contacts.find(function(c) { return c.id === id; });
    
    document.getElementById("active-name").innerText = contact.name;
    document.getElementById("active-avatar").innerText = contact.avatar;
    document.getElementById("active-status").innerText = contact.status;
    
    renderMessages();
    renderChatList();
}

function renderMessages() {
    var msgContainer = document.getElementById("messages");
    msgContainer.innerHTML = "";

    var contact = contacts.find(function(c) { return c.id === activeChatId; });
    
    contact.messages.forEach(function(m) {
        var msgClass = m.sent ? "sent" : "received";
        var msgHtml = `
            <div class="message ${msgClass}">
                ${m.text}
                <span class="msg-time">${m.time}</span>
            </div>
        `;
        msgContainer.innerHTML += msgHtml;
    });
    
    msgContainer.scrollTop = msgContainer.scrollHeight;
}

function sendMessage() {
    var input = document.getElementById("msg-input");
    var text = input.value.trim();
    if (!text) return;

    var contact = contacts.find(function(c) { return c.id === activeChatId; });
    var now = new Date();
    var timeStr = now.getHours() + ":" + (now.getMinutes() < 10 ? "0" : "") + now.getMinutes();

    contact.messages.push({
        text: text,
        time: timeStr,
        sent: true
    });

    input.value = "";
    renderMessages();
    renderChatList();

    // اٹو ریپلائی (Simulated Bot Reply)
    setTimeout(function() {
        contact.messages.push({
            text: "شکریہ! آپ کا پیغام موصول ہو گیا ہے۔",
            time: timeStr,
            sent: false
        });
        renderMessages();
        renderChatList();
    }, 1200);
}

function handleKeyPress(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
}

// Initial Load
window.onload = function() {
    renderChatList();
    selectChat(1);
};
</script>
</body>
</html>
