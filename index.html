<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Candy Blast Deluxe</title>

<style>
:root {
    --gold: #ffd166;
    --border: #68258b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #3b1454 0%, #1a0826 60%, #0d0314 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game-container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 850px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    position: relative;
}

.top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
}

.title {
    font-size: 22px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 2px 8px #000;
}

.stats-card {
    width: 100%;
    background: linear-gradient(145deg, #2b0d40, #180526);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
}

.stat-box { text-align: center; }
.stat-lbl { font-size: 10px; color: #b892cf; font-weight: bold; }
.stat-val { font-size: 18px; color: #fff; font-weight: 900; margin-top: 2px; }

#board-wrapper {
    width: 100%;
    aspect-ratio: 1;
    position: relative;
    background: #0f0417;
    border: 4px solid #8531b0;
    border-radius: 20px;
    box-shadow: 0 10px 30px #000, inset 0 0 15px #000;
}

canvas {
    width: 100%;
    height: 100%;
    border-radius: 16px;
    display: block;
}

.btn-bar {
    display: flex;
    gap: 12px;
    margin-top: 5px;
}

.btn {
    border: 0;
    border-radius: 20px;
    padding: 10px 22px;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    background: linear-gradient(#ff5376, #e60039);
    box-shadow: 0 4px 0 #990026;
}

.btn.blue {
    background: linear-gradient(#3ca5ff, #0066cc);
    box-shadow: 0 4px 0 #004080;
}

.btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #000;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 2, 18, 0.95);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s opacity;
    z-index: 10;
}

.overlay.show {
    opacity: 1;
    pointer-events: auto;
}

.overlay h2 {
    font-size: 30px;
    color: var(--gold);
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="game-container">
    <div class="top-bar">
        <div class="title">🍬 CANDY BLAST</div>
    </div>

    <div class="stats-card">
        <div class="stat-box"><span class="stat-lbl">LEVEL</span><span class="stat-val" id="level-txt">1</span></div>
        <div class="stat-box"><span class="stat-lbl">TARGET</span><span class="stat-val" id="target-txt">1000</span></div>
        <div class="stat-box"><span class="stat-lbl">SCORE</span><span class="stat-val" id="score-txt">0</span></div>
        <div class="stat-box"><span class="stat-lbl">MOVES</span><span class="stat-val" id="moves-txt">20</span></div>
    </div>

    <div id="board-wrapper">
        <canvas id="canvas"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="modal-title">🎉 LEVEL PASSED!</h2>
            <p id="modal-desc" style="margin-bottom: 20px; color: #ddd;"></p>
            <button class="btn" id="modal-btn" onclick="nextLevel()">Continue</button>
        </div>
    </div>

    <div class="btn-bar">
        <button class="btn blue" onclick="resetBoard()">🔄 Shuffle</button>
        <button class="btn blue" onclick="restartLevel()">🔁 Restart</button>
    </div>
</div>

<script>
// @ts-nocheck

var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

var GRID_SIZE = 8;
var tileSize = 0;

var level = 1;
var score = 0;
var target = 1000;
var moves = 20;

var board = [];
var selected = null;
var isAnimating = false;

var ITEMS = [
    { name: 'Red Candy',    emoji: '🍬', color: '#ff4d4d' },
    { name: 'Blue Candy',   emoji: '🍭', color: '#3399ff' },
    { name: 'Green Candy',  emoji: '🍫', color: '#33cc33' },
    { name: 'Yellow Candy', emoji: '🍩', color: '#ffcc00' },
    { name: 'Purple Candy', emoji: '🧁', color: '#cc33ff' },
    { name: 'Orange Candy', emoji: '🍇', color: '#ff9933' }
];

function resizeCanvas() {
    var wrapper = document.getElementById("board-wrapper");
    if (!wrapper) return;
    var rect = wrapper.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    tileSize = canvas.width / GRID_SIZE;
    drawBoard();
}

function initGame() {
    score = 0;
    moves = 20 + level * 2;
    target = level * 1000;
    selected = null;
    isAnimating = false;
    
    updateUI();
    hideOverlay();
    createValidBoard();
    resizeCanvas();
}

// شروعات میں ایسا بورڈ بنانا جس میں کوئی پہلے سے 3-Match نہ ہو
function createValidBoard() {
    do {
        board = [];
        for (var r = 0; r < GRID_SIZE; r++) {
            var row = [];
            for (var c = 0; c < GRID_SIZE; c++) {
                var validTypes = [];
                for (var t = 0; t < ITEMS.length; t++) {
                    if ((c >= 2 && row[c - 1] === t && row[c - 2] === t) ||
                        (r >= 2 && board[r - 1][c] === t && board[r - 2][c] === t)) {
                        continue;
                    }
                    validTypes.push(t);
                }
                var randomType = validTypes[Math.floor(Math.random() * validTypes.length)];
                row.push(randomType);
            }
            board.push(row);
        }
    } while (getMatches().size > 0);
}

function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (var r = 0; r < GRID_SIZE; r++) {
        for (var c = 0; c < GRID_SIZE; c++) {
            var type = board[r][c];
            var x = c * tileSize;
            var y = r * tileSize;
            
            ctx.fillStyle = (r + c) % 2 === 0 ? "rgba(255,255,255,0.03)" : "rgba(0,0,0,0.15)";
            ctx.fillRect(x, y, tileSize, tileSize);
            
            if (type !== null && type !== undefined) {
                var item = ITEMS[type];
                
                ctx.beginPath();
                ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = item.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#fff";
                ctx.stroke();
                
                if (selected && selected.x === c && selected.y === r) {
                    ctx.beginPath();
                    ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize * 0.44, 0, Math.PI * 2);
                    ctx.strokeStyle = "#ffd166";
                    ctx.lineWidth = 6;
                    ctx.stroke();
                }
                
                ctx.font = (tileSize * 0.45) + "px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.emoji, x + tileSize / 2, y + tileSize / 2 + 2);
            }
        }
    }
}

function handleTouch(e) {
    if (isAnimating) return;
    
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    var x = (clientX - rect.left) * (canvas.width / rect.width);
    var y = (clientY - rect.top) * (canvas.height / rect.height);
    
    var c = Math.floor(x / tileSize);
    var r = Math.floor(y / tileSize);
    
    if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) return;
    
    if (!selected) {
        selected = { x: c, y: r };
    } else {
        if (selected.x === c && selected.y === r) {
            selected = null;
        } else {
            var dx = Math.abs(selected.x - c);
            var dy = Math.abs(selected.y - r);
            if (dx + dy === 1) {
                attemptSwap(selected.y, selected.x, r, c);
                selected = null;
            } else {
                selected = { x: c, y: r };
            }
        }
    }
    drawBoard();
}

function attemptSwap(r1, c1, r2, c2) {
    isAnimating = true;
    swap(r1, c1, r2, c2);
    drawBoard();

    setTimeout(function() {
        var matches = getMatches();
        if (matches.size > 0) {
            moves--;
            updateUI();
            processMatches();
        } else {
            // میچ نہ بننے کی صورت میں ریورٹ (Swap Back)
            swap(r1, c1, r2, c2);
            drawBoard();
            isAnimating = false;
        }
    }, 200);
}

function swap(r1, c1, r2, c2) {
    var temp = board[r1][c1];
    board[r1][c1] = board[r2][c2];
    board[r2][c2] = temp;
}

function getMatches() {
    var matched = new Set();
    
    // Horizontal Match
    for (var r = 0; r < GRID_SIZE; r++) {
        for (var c = 0; c < GRID_SIZE - 2; c++) {
            var val = board[r][c];
            if (val !== null && val === board[r][c+1] && val === board[r][c+2]) {
                matched.add(r + "," + c);
                matched.add(r + "," + (c+1));
                matched.add(r + "," + (c+2));
            }
        }
    }
    
    // Vertical Match
    for (var c = 0; c < GRID_SIZE; c++) {
        for (var r = 0; r < GRID_SIZE - 2; r++) {
            var vVal = board[r][c];
            if (vVal !== null && vVal === board[r+1][c] && vVal === board[r+2][c]) {
                matched.add(r + "," + c);
                matched.add((r+1) + "," + c);
                matched.add((r+2) + "," + c);
            }
        }
    }
    return matched;
}

function processMatches() {
    var matches = getMatches();
    if (matches.size > 0) {
        score += matches.size * 20;
        matches.forEach(function(key) {
            var parts = key.split(",");
            var r = parseInt(parts[0]);
            var c = parseInt(parts[1]);
            board[r][c] = Math.floor(Math.random() * ITEMS.length);
        });
        updateUI();
        drawBoard();
        
        setTimeout(function() {
            processMatches(); // کاپ اسکیڈنگ اور متبادل میچز کی چیکنگ
        }, 250);
    } else {
        isAnimating = false;
        checkGameState();
    }
}

function checkGameState() {
    if (score >= target) {
        showOverlay("🎉 LEVEL PASSED!", "You collected " + score + " points.");
    } else if (moves <= 0) {
        showOverlay("💥 GAME OVER", "Out of moves!");
    }
}

function updateUI() {
    var l = document.getElementById("level-txt");
    var t = document.getElementById("target-txt");
    var s = document.getElementById("score-txt");
    var m = document.getElementById("moves-txt");
    
    if (l) l.innerText = level.toString();
    if (t) t.innerText = target.toString();
    if (s) s.innerText = score.toString();
    if (m) m.innerText = moves.toString();
}

function showOverlay(title, desc) {
    var ov = document.getElementById("overlay");
    var mt = document.getElementById("modal-title");
    var md = document.getElementById("modal-desc");
    if (mt) mt.innerText = title;
    if (md) md.innerText = desc;
    if (ov) ov.classList.add("show");
}

function hideOverlay() {
    var ov = document.getElementById("overlay");
    if (ov) ov.classList.remove("show");
}

function nextLevel() {
    if (score >= target) level++;
    initGame();
}

function restartLevel() {
    initGame();
}

function resetBoard() {
    initGame();
}

canvas.addEventListener("click", handleTouch);
window.addEventListener("resize", resizeCanvas);

window.onload = function() {
    initGame();
};
</script>
</body>
</html>
