<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Candy Blast Deluxe</title>

<style>
:root {
    --bg: #16051f;
    --panel: #2b0d40;
    --border: #68258b;
    --gold: #ffd166;
    --pink: #ff477e;
    --blue: #4dabf7;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

body {
    font-family: Arial, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #4b1768 0%, #21082f 38%, #100316 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow: hidden;
}

.screen {
    width: 100%;
    max-width: 440px;
    height: 100vh;
    min-height: 600px;
    display: none;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.screen.active { display: flex; }

/* MAP */
.map-title {
    margin-top: 22px;
    font-size: 34px;
    color: var(--gold);
    text-shadow: 0 3px 10px #000;
}

.map-info {
    margin: 12px 0;
    background: rgba(0,0,0,0.3);
    padding: 10px 18px;
    border-radius: 20px;
}

.map-container {
    width: 94%;
    flex: 1;
    margin-bottom: 15px;
    overflow-y: auto;
    background: rgba(43,13,64,0.85);
    border: 2px solid var(--border);
    border-radius: 25px;
    padding: 30px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    position: relative;
}

.map-container::-webkit-scrollbar { display: none; }

.map-level {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid #9b59b6;
    background: #49205e;
    color: #fff;
    font-size: 23px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 12px #0008;
    position: relative;
    z-index: 2;
}

.map-level:nth-child(odd) { margin-left: 75px; }
.map-level:nth-child(even) { margin-right: 75px; }

.map-level.active {
    background: linear-gradient(#ffd166, #f39c12);
    border-color: #fff;
    color: #4a2600;
    animation: bounce 1s infinite alternate;
}

.map-level.locked {
    background: #252525;
    border-color: #555;
    opacity: 0.65;
    cursor: not-allowed;
}

@keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-7px); }
}

/* GAME HEADER */
.game-top {
    width: 96%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 9px 0;
}

.game-name {
    color: var(--gold);
    font-size: 20px;
    font-weight: 900;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: #42145e;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
}

.header {
    width: 96%;
    background: linear-gradient(145deg, #3b1454, #260b38);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 9px 5px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    box-shadow: 0 6px 18px #0007;
}

.stat { text-align: center; }

.stat-label {
    display: block;
    color: #c8a9d8;
    font-size: 11px;
    font-weight: bold;
}

.stat-value {
    display: block;
    color: #fff;
    font-size: 18px;
    font-weight: 900;
    margin-top: 2px;
}

/* BOARD */
#board-wrap {
    width: min(94vw, 410px);
    aspect-ratio: 1;
    padding: 6px;
    margin-top: 10px;
    position: relative;
    background: #100714;
    border: 4px solid #713294;
    border-radius: 20px;
    box-shadow: 0 10px 25px #0009, inset 0 0 20px #000;
}

#grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 4px;
}

.cell {
    background: rgba(255, 255, 255, 0.055);
    border-radius: 9px;
    position: relative;
}

.candy {
    position: absolute;
    inset: 1px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    cursor: pointer;
    box-shadow: inset 3px 3px 5px #fff8, inset -4px -5px 7px #0006, 0 2px 4px #0009;
    transition: transform 0.16s, filter 0.16s, opacity 0.2s;
}

.c0 { background: #ff3b57; }
.c1 { background: #2d9cff; }
.c2 { background: #27d66d; }
.c3 { background: #ffc400; }
.c4 { background: #a855d8; }
.c5 { background: #ff8c24; }

.selected {
    transform: scale(1.16);
    filter: brightness(1.35);
    box-shadow: 0 0 16px #fff, inset 3px 3px 5px #fff8;
    z-index: 5;
}

/* CONTROLS */
.controls {
    display: flex;
    gap: 9px;
    margin-top: 12px;
}

.btn {
    border: 0;
    border-radius: 24px;
    padding: 11px 18px;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    background: linear-gradient(#ff668d, #ed285b);
    box-shadow: 0 4px 0 #9e1640;
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #9e1640;
}

.btn.blue {
    background: linear-gradient(#62b8ff, #2788e8);
    box-shadow: 0 4px 0 #07579d;
}

.target {
    margin-top: 9px;
    font-weight: bold;
    color: #ffe8a3;
}

/* OVERLAY */
.overlay {
    position: absolute;
    inset: 0;
    border-radius: 17px;
    background: rgba(8, 2, 13, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
    z-index: 20;
}

.overlay.show {
    opacity: 1;
    pointer-events: auto;
}

.overlay h2 {
    font-size: 29px;
    color: var(--gold);
    margin-bottom: 10px;
}

.overlay p {
    color: #eee;
    font-size: 16px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- MAP SCREEN -->
<section id="map-screen" class="screen active">
    <h1 class="map-title">🍬 Candy Blast</h1>
    <div class="map-info">
        ❤️ Lives: <b id="map-lives">5</b>
        &nbsp; | &nbsp;
        🏆 Best: <b id="map-best">0</b>
    </div>
    <div class="map-container" id="map-tree"></div>
</section>

<!-- GAME SCREEN -->
<section id="game-screen" class="screen">
    <div class="game-top">
        <button class="icon-btn" onclick="exitToMap()">🗺️</button>
        <div class="game-name">🍬 CANDY BLAST</div>
        <button class="icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
    </div>
    <div class="header">
        <div class="stat">
            <span class="stat-label">LEVEL</span>
            <span class="stat-value" id="level-val">1</span>
        </div>
        <div class="stat">
            <span class="stat-label">TARGET</span>
            <span class="stat-value" id="target-val">1000</span>
        </div>
        <div class="stat">
            <span class="stat-label">SCORE</span>
            <span class="stat-value" id="score-val">0</span>
        </div>
        <div class="stat">
            <span class="stat-label">MOVES</span>
            <span class="stat-value" id="moves-val">22</span>
        </div>
    </div>
    <div id="board-wrap">
        <div id="grid"></div>
        <div id="overlay" class="overlay">
            <h2 id="modal-title">🎉 Level Complete!</h2>
            <p id="modal-desc"></p>
            <button class="btn" id="modal-btn" onclick="modalAction()">Next Level</button>
        </div>
    </div>
    <div class="target">
        🎯 Target: <span id="target-bottom">1000</span>
    </div>
    <div class="controls">
        <button class="btn blue" onclick="shuffleBoard()">🔄 Shuffle</button>
        <button class="btn blue" onclick="exitToMap()">🗺️ Map</button>
    </div>
</section>

<script>
// @ts-nocheck

var SIZE = 8;
var TYPES = 6;

var board = [];
var level = 1;
var score = 0;
var target = 1000;
var moves = 22;

var lives = 5;
var highScore = 0;
var unlocked = 1;

var selected = null;
var processing = false;
var soundEnabled = true;

function loadData() {
    lives = parseInt(localStorage.getItem("cb_lives") || "5") || 5;
    highScore = parseInt(localStorage.getItem("cb_highscore") || "0") || 0;
    unlocked = parseInt(localStorage.getItem("cb_unlocked") || "1") || 1;
}

function saveData() {
    localStorage.setItem("cb_lives", lives.toString());
    localStorage.setItem("cb_highscore", highScore.toString());
    localStorage.setItem("cb_unlocked", unlocked.toString());
}

function renderMap() {
    loadData();
    var ml = document.getElementById("map-lives");
    var mb = document.getElementById("map-best");
    if(ml) ml.innerText = lives.toString();
    if(mb) mb.innerText = highScore.toString();
    
    var tree = document.getElementById("map-tree");
    if(!tree) return;
    tree.innerHTML = "";
    
    for(var i = 1; i <= 30; i++) {
        (function(lvl) {
            var btn = document.createElement("div");
            btn.className = "map-level";
            if(lvl === unlocked) btn.classList.add("active");
            if(lvl > unlocked) {
                btn.classList.add("locked");
                btn.innerText = "🔒";
            } else {
                btn.innerText = lvl.toString();
                btn.onclick = function() { startLevel(lvl); };
            }
            tree.appendChild(btn);
        })(i);
    }
}

function exitToMap() {
    var gameEl = document.getElementById("game-screen");
    var mapEl = document.getElementById("map-screen");
    if(gameEl) gameEl.classList.remove("active");
    if(mapEl) mapEl.classList.add("active");
    renderMap();
}

/**
 * @param {number} lvl
 */
function startLevel(lvl) {
    if(lvl > unlocked) return;
    level = lvl;
    score = 0;
    moves = 20 + level * 2;
    target = level * 1000;
    selected = null;
    processing = false;
    
    var mapEl = document.getElementById("map-screen");
    var gameEl = document.getElementById("game-screen");
    if(mapEl) mapEl.classList.remove("active");
    if(gameEl) gameEl.classList.add("active");
    
    hideModal();
    createBoard();
    updateUI();
}

function createBoard() {
    var grid = document.getElementById("grid");
    if(!grid) return;
    grid.innerHTML = "";
    board = new Array(SIZE * SIZE);
    
    for(var i = 0; i < SIZE * SIZE; i++) {
        var cell = document.createElement("div");
        cell.className = "cell";
        grid.appendChild(cell);
    }
    
    for(var j = 0; j < SIZE * SIZE; j++) {
        board[j] = Math.floor(Math.random() * TYPES);
    }
    renderBoard();
}

function renderBoard() {
    var grid = document.getElementById("grid");
    if(!grid) return;
    var cells = grid.children;
    
    for(var i = 0; i < SIZE * SIZE; i++) {
        cells[i].innerHTML = "";
        if(board[i] !== null && board[i] !== undefined) {
            var candy = document.createElement("div");
            candy.className = "candy c-" + board[i];
            if(selected === i) candy.classList.add("selected");
            
            (function(idx) {
                candy.onclick = function() { selectCandy(idx); };
            })(i);
            
            cells[i].appendChild(candy);
        }
    }
}

/**
 * @param {number} index
 */
function selectCandy(index) {
    if(processing) return;
    
    if(selected === null) {
        selected = index;
        renderBoard();
        return;
    }
    
    if(selected === index) {
        selected = null;
        renderBoard();
        return;
    }
    
    if(isAdjacent(selected, index)) {
        swap(selected, index);
        selected = null;
        moves--;
        updateUI();
        renderBoard();
        checkMatches();
    } else {
        selected = index;
        renderBoard();
    }
}

/**
 * @param {number} a
 * @param {number} b
 */
function isAdjacent(a, b) {
    var r1 = Math.floor(a / SIZE);
    var c1 = a % SIZE;
    var r2 = Math.floor(b / SIZE);
    var c2 = b % SIZE;
    return Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;
}

/**
 * @param {number} a
 * @param {number} b
 */
function swap(a, b) {
    var temp = board[a];
    board[a] = board[b];
    board[b] = temp;
}

function checkMatches() {
    var matched = new Set();
    
    /* Horizontal */
    for(var r = 0; r < SIZE; r++) {
        for(var c = 0; c < SIZE - 2; c++) {
            var idx = r * SIZE + c;
            var val = board[idx];
            if(val !== null && val === board[idx+1] && val === board[idx+2]) {
                matched.add(idx);
                matched.add(idx+1);
                matched.add(idx+2);
            }
        }
    }
    
    /* Vertical */
    for(var c = 0; c < SIZE; c++) {
        for(var r = 0; r < SIZE - 2; r++) {
            var vIdx = r * SIZE + c;
            var vVal = board[vIdx];
            if(vVal !== null && vVal === board[(r+1)*SIZE+c] && vVal === board[(r+2)*SIZE+c]) {
                matched.add(vIdx);
                matched.add((r+1)*SIZE+c);
                matched.add((r+2)*SIZE+c);
            }
        }
    }
    
    if(matched.size > 0) {
        score += matched.size * 10;
        updateUI();
        
        matched.forEach(function(i) {
            board[i] = Math.floor(Math.random() * TYPES);
        });
        
        renderBoard();
        checkGameState();
    } else {
        checkGameState();
    }
}

function shuffleBoard() {
    for(var i = 0; i < SIZE * SIZE; i++) {
        board[i] = Math.floor(Math.random() * TYPES);
    }
    renderBoard();
}

function updateUI() {
    var lv = document.getElementById("level-val");
    var sv = document.getElementById("score-val");
    var tv = document.getElementById("target-val");
    var tb = document.getElementById("target-bottom");
    var mv = document.getElementById("moves-val");
    
    if(lv) lv.innerText = level.toString();
    if(sv) sv.innerText = score.toString();
    if(tv) tv.innerText = target.toString();
    if(tb) tb.innerText = target.toString();
    if(mv) mv.innerText = moves.toString();
}

function checkGameState() {
    if(score >= target) {
        if(score > highScore) highScore = score;
        if(level === unlocked) unlocked = Math.min(30, unlocked + 1);
        saveData();
        showModal("🎉 LEVEL COMPLETE!", "You scored " + score + " points.", "Next Level");
        return;
    }
    if(moves <= 0) {
        lives = Math.max(0, lives - 1);
        saveData();
        if(lives > 0) {
            showModal("💥 GAME OVER!", "Out of moves. Lives left: " + lives, "Try Again");
        } else {
            showModal("💔 NO LIVES", "Out of lives!", "Go to Map");
        }
    }
}

/**
 * @param {string} title
 * @param {string} desc
 * @param {string} button
 */
function showModal(title, desc, button) {
    var mt = document.getElementById("modal-title");
    var md = document.getElementById("modal-desc");
    var mb = document.getElementById("modal-btn");
    var ov = document.getElementById("overlay");
    
    if(mt) mt.innerText = title;
    if(md) md.innerText = desc;
    if(mb) mb.innerText = button;
    if(ov) ov.classList.add("show");
}

function hideModal() {
    var ov = document.getElementById("overlay");
    if(ov) ov.classList.remove("show");
}

function modalAction() {
    hideModal();
    if(score >= target) {
        if(level < 30) startLevel(level + 1);
        else exitToMap();
    } else {
        if(lives > 0) startLevel(level);
        else exitToMap();
    }
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    var btn = document.getElementById("sound-btn");
    if(btn) btn.innerText = soundEnabled ? "🔊" : "🔇";
}

window.onload = function() {
    renderMap();
};
</script>
</body>
</html>
