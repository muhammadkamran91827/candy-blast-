<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Candy Blast Deluxe</title>

<style>
:root {
    --gold: #ffd166;
    --border: #a855f7;
    --bg-dark: #1e0933;
    --panel-bg: linear-gradient(135deg, #2e1065, #1e0538);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: radial-gradient(circle at center, #3b0764 0%, #1a052c 70%, #090112 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game-container {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 850px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    position: relative;
}

.top-bar {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 6px;
}

.title {
    font-size: 24px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255, 209, 102, 0.6), 0 3px 6px #000;
    letter-spacing: 1px;
}

.stats-card {
    width: 100%;
    background: var(--panel-bg);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 12px 8px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.2);
}

.stat-box { 
    text-align: center; 
}

.stat-lbl { 
    font-size: 11px; 
    color: #c084fc; 
    font-weight: 800; 
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.stat-val { 
    font-size: 20px; 
    color: #ffffff; 
    font-weight: 900; 
    margin-top: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

#board-wrapper {
    width: 100%;
    aspect-ratio: 1;
    position: relative;
    background: #11031d;
    border: 4px solid #9333ea;
    border-radius: 22px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.9), inset 0 0 20px #000;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    display: block;
}

.btn-bar {
    display: flex;
    gap: 14px;
    margin-top: 6px;
    width: 100%;
    justify-content: center;
}

.btn {
    border: none;
    border-radius: 25px;
    padding: 12px 26px;
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    background: linear-gradient(180deg, #ec4899 0%, #be185d 100%);
    box-shadow: 0 5px 0 #831843, 0 8px 15px rgba(0,0,0,0.4);
    transition: all 0.1s ease;
}

.btn.blue {
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
    box-shadow: 0 5px 0 #0369a1, 0 8px 15px rgba(0,0,0,0.4);
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #000;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 3, 25, 0.94);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 10;
}

.overlay.show {
    opacity: 1;
    pointer-events: auto;
}

.overlay h2 {
    font-size: 32px;
    color: var(--gold);
    margin-bottom: 12px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.8);
}

.overlay p {
    font-size: 16px;
    color: #e9d5ff;
    margin-bottom: 24px;
}
</style>
</head>

<body>

<div class="game-container">
    <div class="top-bar">
        <div class="title">🍬 CANDY BLAST DELUXE</div>
    </div>

    <div class="stats-card">
        <div class="stat-box"><div class="stat-lbl">LEVEL</div><div class="stat-val" id="level-txt">1</div></div>
        <div class="stat-box"><div class="stat-lbl">TARGET</div><div class="stat-val" id="target-txt">1000</div></div>
        <div class="stat-box"><div class="stat-lbl">SCORE</div><div class="stat-val" id="score-txt">0</div></div>
        <div class="stat-box"><div class="stat-lbl">MOVES</div><div class="stat-val" id="moves-txt">20</div></div>
    </div>

    <div id="board-wrapper">
        <canvas id="canvas"></canvas>
        <div id="overlay" class="overlay">
            <h2 id="modal-title">🎉 LEVEL PASSED!</h2>
            <p id="modal-desc"></p>
            <button class="btn" id="modal-btn" onclick="nextLevel()">Continue</button>
        </div>
    </div>

    <div class="btn-bar">
        <button class="btn blue" onclick="resetBoard()">🔄 Shuffle</button>
        <button class="btn blue" onclick="restartLevel()">🔁 Restart</button>
    </div>
</div>

<script>
// @ts-nocheck

var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");

var GRID_SIZE = 8;
var tileSize = 0;

var level = 1;
var score = 0;
var target = 1000;
var moves = 20;

var board = [];
var selected = null;
var isAnimating = false;

// Royal Match / Candy Deluxe Style Items
var ITEMS = [
    { name: 'Crown',   emoji: '👑', color: '#fbbf24', border: '#b45309' },
    { name: 'Gem',     emoji: '💎', color: '#38bdf8', border: '#0369a1' },
    { name: 'Apple',   emoji: '🍎', color: '#f87171', border: '#b91c1c' },
    { name: 'Shield',  emoji: '🛡️', color: '#4ade80', border: '#15803d' },
    { name: 'Leaf',    emoji: '🍃', color: '#c084fc', border: '#6b21a8' },
    { name: 'Star',    emoji: '⭐', color: '#fb923c', border: '#c2410c' }
];

function resizeCanvas() {
    var wrapper = document.getElementById("board-wrapper");
    if (!wrapper) return;
    var rect = wrapper.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    tileSize = canvas.width / GRID_SIZE;
    drawBoard();
}

function initGame() {
    score = 0;
    moves = 20 + level * 2;
    target = level * 1000;
    selected = null;
    isAnimating = false;
    
    updateUI();
    hideOverlay();
    createValidBoard();
    resizeCanvas();
}

// شروعات میں 100% بغیر کسی میچ کے بورڈ بنانا
function createValidBoard() {
    do {
        board = [];
        for (var r = 0; r < GRID_SIZE; r++) {
            var row = [];
            for (var c = 0; c < GRID_SIZE; c++) {
                var validTypes = [];
                for (var t = 0; t < ITEMS.length; t++) {
                    if ((c >= 2 && row[c - 1] === t && row[c - 2] === t) ||
                        (r >= 2 && board[r - 1][c] === t && board[r - 2][c] === t)) {
                        continue;
                    }
                    validTypes.push(t);
                }
                var randomType = validTypes[Math.floor(Math.random() * validTypes.length)];
                row.push(randomType);
            }
            board.push(row);
        }
    } while (getMatches().size > 0);
}

function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (var r = 0; r < GRID_SIZE; r++) {
        for (var c = 0; c < GRID_SIZE; c++) {
            var type = board[r][c];
            var x = c * tileSize;
            var y = r * tileSize;
            
            // گربڈ کا پس منظر (Grid Pattern)
            ctx.fillStyle = (r + c) % 2 === 0 ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.2)";
            ctx.fillRect(x, y, tileSize, tileSize);
            
            if (type !== null && type !== undefined) {
                var item = ITEMS[type];
                var centerX = x + tileSize / 2;
                var centerY = y + tileSize / 2;
                var radius = tileSize * 0.38;

                // بلبلہ / کینڈی بیس (Gradient Base)
                var grad = ctx.createRadialGradient(
                    centerX - radius * 0.3, centerY - radius * 0.3, radius * 0.1,
                    centerX, centerY, radius
                );
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, item.color);
                grad.addColorStop(1, item.border);

                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // منتخب شدہ آئٹم کا گولڈن اثر (Selection Glow)
                if (selected && selected.x === c && selected.y === r) {
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = "#ffd166";
                    ctx.lineWidth = 5;
                    ctx.stroke();
                }

                // آئکن / ایاموجی (Emoji Display)
                ctx.font = (tileSize * 0.42) + "px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.emoji, centerX, centerY + 2);
            }
        }
    }
}

function handleTouch(e) {
    if (isAnimating) return;
    
    var rect = canvas.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    var x = (clientX - rect.left) * (canvas.width / rect.width);
    var y = (clientY - rect.top) * (canvas.height / rect.height);
    
    var c = Math.floor(x / tileSize);
    var r = Math.floor(y / tileSize);
    
    if (r < 0 || r >= GRID_SIZE || c < 0 || c >= GRID_SIZE) return;
    
    if (!selected) {
        selected = { x: c, y: r };
    } else {
        if (selected.x === c && selected.y === r) {
            selected = null;
        } else {
            var dx = Math.abs(selected.x - c);
            var dy = Math.abs(selected.y - r);
            if (dx + dy === 1) {
                attemptSwap(selected.y, selected.x, r, c);
                selected = null;
            } else {
                selected = { x: c, y: r };
            }
        }
    }
    drawBoard();
}

function attemptSwap(r1, c1, r2, c2) {
    isAnimating = true;
    swap(r1, c1, r2, c2);
    drawBoard();

    setTimeout(function() {
        var matches = getMatches();
        if (matches.size > 0) {
            moves--;
            updateUI();
            processCascadingMatches();
        } else {
            // اگر میچ نہ بنے تو سوپ واپس (Revert Swap)
            swap(r1, c1, r2, c2);
            drawBoard();
            isAnimating = false;
        }
    }, 220);
}

function swap(r1, c1, r2, c2) {
    var temp = board[r1][c1];
    board[r1][c1] = board[r2][c2];
    board[r2][c2] = temp;
}

function getMatches() {
    var matched = new Set();
    
    // افقی میچز (Horizontal)
    for (var r = 0; r < GRID_SIZE; r++) {
        for (var c = 0; c < GRID_SIZE - 2; c++) {
            var val = board[r][c];
            if (val !== null && val === board[r][c+1] && val === board[r][c+2]) {
                matched.add(r + "," + c);
                matched.add(r + "," + (c+1));
                matched.add(r + "," + (c+2));
            }
        }
    }
    
    // عمودی میچز (Vertical)
    for (var c = 0; c < GRID_SIZE; c++) {
        for (var r = 0; r < GRID_SIZE - 2; r++) {
            var vVal = board[r][c];
            if (vVal !== null && vVal === board[r+1][c] && vVal === board[r+2][c]) {
                matched.add(r + "," + c);
                matched.add((r+1) + "," + c);
                matched.add((r+2) + "," + c);
            }
        }
    }
    return matched;
}

// میچز ختم کرنے اور اوپر سے آئٹمز گرانے (Cascading) کا عمل
function processCascadingMatches() {
    var matches = getMatches();
    if (matches.size > 0) {
        score += matches.size * 25;
        
        // 1. ختم ہونے والے خانے خالی کریں
        matches.forEach(function(key) {
            var parts = key.split(",");
            var r = parseInt(parts[0]);
            var c = parseInt(parts[1]);
            board[r][c] = null;
        });
        
        updateUI();
        drawBoard();

        // 2. گریویٹی کے ذریعے نیچے لائیں اور نئے آئٹمز ڈالیں
        setTimeout(function() {
            applyGravityAndRefill();
            drawBoard();

            // 3. اگلا سلسلہ وار میچ (Combo) چیک کریں
            setTimeout(function() {
                processCascadingMatches();
            }, 250);
        }, 200);
    } else {
        isAnimating = false;
        checkGameState();
    }
}

function applyGravityAndRefill() {
    for (var c = 0; c < GRID_SIZE; c++) {
        var emptySpot = GRID_SIZE - 1;
        for (var r = GRID_SIZE - 1; r >= 0; r--) {
            if (board[r][c] !== null) {
                board[emptySpot][c] = board[r][c];
                if (emptySpot !== r) {
                    board[r][c] = null;
                }
                emptySpot--;
            }
        }
        for (var fillR = emptySpot; fillR >= 0; fillR--) {
            board[fillR][c] = Math.floor(Math.random() * ITEMS.length);
        }
    }
}

function checkGameState() {
    if (score >= target) {
        showOverlay("🎉 LEVEL PASSED!", "Great Job! Score: " + score);
    } else if (moves <= 0) {
        showOverlay("💥 GAME OVER", "Out of moves!");
    }
}

function updateUI() {
    var l = document.getElementById("level-txt");
    var t = document.getElementById("target-txt");
    var s = document.getElementById("score-txt");
    var m = document.getElementById("moves-txt");
    
    if (l) l.innerText = level.toString();
    if (t) t.innerText = target.toString();
    if (s) s.innerText = score.toString();
    if (m) m.innerText = moves.toString();
}

function showOverlay(title, desc) {
    var ov = document.getElementById("overlay");
    var mt = document.getElementById("modal-title");
    var md = document.getElementById("modal-desc");
    if (mt) mt.innerText = title;
    if (md) md.innerText = desc;
    if (ov) ov.classList.add("show");
}

function hideOverlay() {
    var ov = document.getElementById("overlay");
    if (ov) ov.classList.remove("show");
}

function nextLevel() {
    if (score >= target) level++;
    initGame();
}

function restartLevel() {
    initGame();
}

function resetBoard() {
    initGame();
}

canvas.addEventListener("click", handleTouch);
window.addEventListener("resize", resizeCanvas);

window.onload = function() {
    initGame();
};
</script>
</body>
</html>
